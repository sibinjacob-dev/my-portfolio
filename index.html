<!doctype html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101c1f" />
    <script>
      try {
        const savedTheme = localStorage.getItem('sibin-portfolio-theme');
        if (savedTheme === 'dark' || (!savedTheme && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (_) {}
    </script>
    <meta name="description" content="Choose between Sibin Jacob’s professional Site Reliability Engineering portfolio and his separate independent creative-services portfolio." />
