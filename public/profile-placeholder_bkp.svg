<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 760" role="img" aria-labelledby="title desc">
  <title id="title">Sibin Jacob profile photograph placeholder</title>
  <desc id="desc">A stylised placeholder with the initials SJ, ready to be replaced by a portrait.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#d9ece8"/><stop offset="1" stop-color="#a8cec7"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0v34" fill="none" stroke="#167d78" stroke-opacity=".1"/></pattern>
  </defs>
  <rect width="620" height="760" fill="url(#bg)"/>
  <rect width="620" height="760" fill="url(#grid)"/>
  <circle cx="440" cy="190" r="230" fill="url(#glow)"/>
  <circle cx="310" cy="278" r="118" fill="#f1f6f4" stroke="#167d78" stroke-opacity=".2" stroke-width="4"/>
  <path d="M96 760c20-188 92-290 214-290s194 102 214 290" fill="#17383a"/>
  <path d="M174 760c13-132 58-211 136-211s123 79 136 211" fill="#205d5c" opacity=".6"/>
  <text x="310" y="306" fill="#167d78" font-family="Arial, sans-serif" font-size="78" font-weight="800" text-anchor="middle">SJ</text>
  <g fill="#17383a" font-family="Arial, sans-serif" text-anchor="middle">
    <text x="310" y="675" font-size="15" font-weight="700" letter-spacing="4">PORTRAIT PLACEHOLDER</text>
    <text x="310" y="706" font-size="11" opacity=".62">Replace /public/profile-placeholder.svg</text>
  </g>
</svg>
